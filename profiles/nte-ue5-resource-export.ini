# Observed installation: Windows x64, Unreal Engine 5 build.
# Bind this profile to the inspected executable; do not reuse after a client update.
module=HTGame.exe
client_root=C:\Program Files\Neverness To Everness
exe_sha256=64ed3cae0b5fc61f3b56cdd933b4807cb23f0ec7913590db60d1a8642de2dfec

# Validated in the matching live HTGame.exe on 2026-11-14: unique NamePool
# and UObject/Class samples. Metadata offsets below retain independent checks.
# Zero restores bounded automatic discovery after revalidating a new build.
name_pool_rva=0x1029cd80
object_array_rva=0x10380ef0

# Base layout validated by the matching client's collected objects and fields.
# Optional property targets and bool masks remain unresolved below.
name_pool_blocks_offset=16
name_pool_current_block_offset=8
name_pool_current_byte_cursor_offset=12
name_entry_length_shift=6
name_entry_wide_mask=1
name_entry_header_size=2
name_entry_stride=2
name_block_bits=16

object_array_chunks_offset=16
object_array_num_elements_offset=36
object_array_max_elements_offset=32
object_array_num_chunks_offset=44
object_array_max_chunks_offset=40
object_item_stride=24
object_item_object_offset=0
object_array_elements_per_chunk=65536

object_flags_offset=8
object_index_offset=12
object_class_offset=16
object_name_offset=24
object_outer_offset=32
fname_number_offset=4

struct_super_offset=64
struct_size_offset=88
struct_child_properties_offset=80
field_class_offset=8
field_next_offset=24
field_name_offset=32
field_class_name_offset=0
property_array_dim_offset=48
property_element_size_offset=52
property_flags_offset=56
property_offset_offset=68
property_target_offset=-1
bool_field_mask_offset=-1
function_flags_offset=176
function_params_size_offset=182
function_native_offset=216

# Reflection metadata only. RPCId is not a wire FieldNetIndex; RepIndex is
# checked against available class replication records, never used as a handle.
function_rpc_id_offset=186
function_rpc_response_id_offset=188
property_rep_index_offset=64
property_rep_condition_offset=66
property_rep_notify_offset=104
enum_names_offset=64
enum_item_stride=16

max_objects=2000000
max_fields_per_type=4096
max_name_length=1023
max_type_size=16777216
auto_scan_max_mb=512

# Same-build GetLocalNetworkVersion and Hello binding; no guessed checksum.
network_version_collect=1
network_version_getter_rva=0x16414a0
network_version_hello_call_rva=0x60a75b0
network_version_watch_seconds=900

# AES worker uses the live process, independently of reflection capture.
# aes_hotkey=1 arms the scan for F9 in this capture's dumper terminal;
# aes_hotkey=0 starts it immediately. Optional aes_pak overrides auto-discovery
# with an absolute Pak/directory path.
aes_hunt=1
aes_hotkey=1
aes_timeout_seconds=120
aes_retry_ms=2000
aes_unaligned=1

# F10 captures fresh loaded tables, assets, world/level/actor/component values,
# game class defaults, reflected script assets, references and text
# candidates. The watcher lives until the process exits; each capture is new.
resource_hotkey=1
resource_game_objects=1
resource_timeout_seconds=600
resource_max_entries=100000
resource_max_values=5000000
resource_max_output_mb=1024
resource_max_string=65536
resource_max_depth=16

# Prioritize menu assets, referenced tables, minimap data and combat resources.
resource_feature_exports=1
resource_feature_max_objects=4096
resource_map_max_objects=4096
resource_capture_network=1
