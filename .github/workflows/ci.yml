name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional dependencies for full test coverage
        run: python -m pip install -r requirements.txt
      - name: Build all native targets
        shell: cmd
        run: build_native.bat
      - name: Native reflection and AES self-tests
        shell: pwsh
        run: |
          & .\build\EbonReflectionSelfTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\build\EbonAesSelfTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Python and isolated DLL/resource integration tests
        shell: pwsh
        run: |
          $env:EBON_TEST_BUILD_DIR = (Resolve-Path build).Path
          python -m unittest discover -s tests -p 'test_*.py' -v
          exit $LASTEXITCODE
